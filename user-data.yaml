#cloud-config

hostname: {name}

timezone: America/Phoenix

growpart:
  devices: [/]
  mode: auto

user:
  name: admin

ssh_authorized_keys:
  - ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBMfz5mLAhimxQDvklU4ezuLiODqNukw6b9S5UUlT1S6U6dIKlM0qfpjlcvCAv7O0524M4Sfk1iEyal61pu28jPEq+QyC3r9u6jNlLn5SVfxipXavcyHr+RIRkhBXnJhVDQ==

ssh:
  emit_keys_to_console: false

yum_repos:
  docker-ce-stable:
    name: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/9/$basearch/stable
    gpgcheck: 1
    gpgkey: https://download.docker.com/linux/centos/gpg

package_update: true
packages:
  - https://github.com/xenserver/xe-guest-utilities/releases/download/v10.0.0/xe-guest-utilities-10.0.0-1.x86_64.rpm
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - kpatch-dnf
  - kpatch-runtime
  - git

write_files:
  # GSSAPI Auth is causing slowdowns on ssh login, disable it
  - path: /etc/ssh/sshd_config.d/00-zuba.conf
    permissions: 0600
    content: |
      GSSAPIAuthentication no

  - path: /usr/local/bin/check-reboot-livepatch.sh
    permissions: 0755
    content: |
      #!/bin/bash
      TAG="update-script"
      
      logger -t $TAG "Starting post-upgrade maintenance check."

      # 1. Check Kernel First: Is live-patching support no longer available?
      # If the output indicates a reboot is needed, we exit immediately.
      if dnf kernel-livepatch support | grep -q "Reboot into the latest kernel"; then
          logger -t $TAG "CRITICAL: Live-patching window expired. Rebooting in 60s. Skipping service restarts."
          /usr/sbin/shutdown -r +1 "Kernel live-patching window expired"
          exit 0
      fi

      logger -t $TAG "Kernel $(uname -r) still has live-patch support. Checking userspace services..."

      # 2. Restart services using outdated libraries
      # This only runs if the reboot check above didn't trigger an exit.
      SERVICES=$(/usr/bin/needs-restarting -s)
      if [ -n "$SERVICES" ]; then
          for SERVICE in $SERVICES; do
              # Skip critical infra services to prevent session/bus drops
              if [[ "$SERVICE" == "dbus.service" || "$SERVICE" == "systemd-logind.service" ]]; then
                  logger -t $TAG "Skipping restart of protected service: $SERVICE"
                  continue
              fi
              logger -t $TAG "Restarting service to apply updates: $SERVICE"
              systemctl restart "$SERVICE"
          done
      else
          logger -t $TAG "No userspace services require restarting."
      fi

      logger -t $TAG "Maintenance check complete."

  - path: /etc/systemd/system/dnf-upgrade.service
    content: |
      [Unit]
      Description=Live-patch aware automatic upgrades
      After=network-online.target

      [Service]
      Type=oneshot
      # Ensure required tools are installed (dnf-utils provides needs-restarting)
      ExecStartPre=/usr/bin/dnf install -y dnf-utils binutils
      ExecStart=/usr/bin/dnf upgrade --assumeyes --releasever=latest
      # Execute the optimized reboot-first logic
      ExecStartPost=/usr/local/bin/check-reboot-livepatch.sh

  - path: /etc/systemd/system/dnf-upgrade.timer
    content: |
      [Unit]
      Description=Timer for automatic upgrades for dnf packages

      [Timer]
      OnCalendar=daily
      Persistent=true
      RandomizedDelaySec=1h

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/acme.service
    content: |
      [Unit]
      Description=Renew certificates using acme.sh
      After=network-online.target nss-lookup.target

      [Service]
      Type=oneshot
      SyslogIdentifier=acme.sh
      Environment=AUTO_UPGRADE=1 NO_TIMESTAMP=1
      ExecStart=/root/.acme.sh/acme.sh --cron --home /root/.acme.sh

  - path: /etc/systemd/system/acme.timer
    content: |
      [Unit]
      Description=Daily renewal of certificates

      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
  # The version of cloud-init that ships with AL2023 didn't take the cloud-init.disabled file into account, this helps
  - path: /etc/systemd/system/cloud-init-local.service.d/override.conf
    content: |
      [Unit]
      ConditionPathExists=!/etc/cloud/cloud-init.disabled

  - path: /etc/systemd/system/cloud-init.service.d/override.conf
    content: |
      [Unit]
      ConditionPathExists=!/etc/cloud/cloud-init.disabled

  - path: /etc/systemd/system/cloud-config.service.d/override.conf
    content: |
      [Unit]
      ConditionPathExists=!/etc/cloud/cloud-init.disabled

  - path: /etc/systemd/system/cloud-final.service.d/override.conf
    content: |
      [Unit]
      ConditionPathExists=!/etc/cloud/cloud-init.disabled

runcmd:
  # Fix rngd by excluding jitter source
  - sed -i 's/nist"/nist -x jitter"/g' /etc/sysconfig/rngd
  - systemctl restart rngd

  # Setting up Live Patching
  - dnf kernel-livepatch -y auto

  # Remove stuff not needed
  - dnf remove -y amazon-ssm-agent

  # Add default user to docker group
  - usermod -a -G docker admin

  # Install acme.sh (no longer in Docker, more flexibility here)
  - 'curl -sL https://get.acme.sh | PROFILE=/root/.bashrc sh -s -- force --home /root/.acme.sh --nocron'

  # Enable/start/disable services
  - systemctl enable docker
  - systemctl enable kpatch
  - systemctl enable dnf-upgrade.timer
  - systemctl enable acme.timer

  # Disable cloud-init
  - touch /etc/cloud/cloud-init.disabled

power_state:
  mode: reboot
  condition: true
  message: Rebooting...