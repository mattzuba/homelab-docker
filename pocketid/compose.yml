include:
  - path: ../common/cloudflare/compose.yaml
  - path: ../common/watchtower/compose.yaml

services:
  pocket-id:
    image: pocketid/pocket-id:v2 # or ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env
    hostname: pocket-id.${HOSTNAME:?Set the HOSTNAME .env variable}
    volumes:
      - pocket_id_data:/app/data
    labels:
      - com.centurylinklabs.watchtower.scope=${HOSTNAME}
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  pocket_id_data:
